  <link rel="stylesheet" href="style.css">
  <style>
    body {
      -webkit-user-select: none;
      -moz-user-select: none;
      -ms-user-select: none;
      user-select: none;
    }
    img {
      -webkit-user-drag: none;
      user-drag: none;
    }

    #custom-context-menu {
      --shake: 0px;
      position: fixed;
      z-index: 10000;
      font-size: 13px;
      font-weight: 600;
      font-family: inherit;
      white-space: nowrap;
      pointer-events: none;
      opacity: 0;
      transform: translateY(8px) scale(.85);
      transition: opacity .3s ease, transform .3s cubic-bezier(.2, .8, .2, 1);
      text-shadow: 0 0 12px currentColor;
    }
    #custom-context-menu.show {
      opacity: 1;
      transform: none;
    }
    #custom-context-menu.pop {
      animation: menu-pop .35s cubic-bezier(.2, .8, .2, 1), menu-shake .4s linear;
    }
    @keyframes menu-pop {
      0%   { transform: translateY(10px) scale(.6); }
      60%  { transform: translateY(-3px) scale(1.15); }
      100% { transform: none; }
    }
    @keyframes menu-shake {
      0%, 100% { translate: 0 0; }
      20% { translate: calc(var(--shake) * -1) calc(var(--shake) * .5); }
      40% { translate: var(--shake) calc(var(--shake) * -.5); }
      60% { translate: calc(var(--shake) * -.7) 0; }
      80% { translate: calc(var(--shake) * .7) 0; }
    }

    body::after {
      content: "";
      position: fixed; inset: 0; z-index: 9000;
      pointer-events: none;
      background: radial-gradient(ellipse at center, transparent 40%, rgba(255, 0, 0, .35) 100%);
      opacity: var(--rage, 0);
      transition: opacity .4s ease;
    }

    #screamer-overlay {
      position: fixed;
      inset: 0;
      z-index: 99999;
      background: #000;
      display: grid;
      place-items: center;
      overflow: hidden;
      opacity: 0;
      pointer-events: none;
      transition: opacity 1.4s ease, visibility 1.4s;
      visibility: hidden;
    }
    #screamer-overlay.show {
      opacity: 1;
      visibility: visible;
      pointer-events: auto;
      transition: opacity .05s linear;
    }
    #screamer-overlay video {
      width: 100vw;
      height: 100vh;
      width: 100dvw;
      height: 100dvh;
      object-fit: contain;
    }
    #screamer-overlay.show video {
      animation: scream-zoom 1.5s ease-out forwards, scream-shake .08s linear infinite;
    }
    @keyframes scream-zoom {
      from { scale: 1;    filter: contrast(1.2) saturate(1.3); }
      to   { scale: 1.12; filter: contrast(1.6) saturate(1.8) brightness(1.1); }
    }
    @keyframes scream-shake {
      0%   { translate: 0 0; }
      25%  { translate: -6px 4px; }
      50%  { translate: 5px -5px; }
      75%  { translate: -4px -3px; }
      100% { translate: 3px 5px; }
    }

    #sorry-msg {
      animation: none;
    }
    #custom-context-menu.sorry {
      font-size: 22px;
      transform: translate(-50%, -50%);
      animation: sorry-in .8s cubic-bezier(.2, .8, .2, 1) backwards;
    }
    @keyframes sorry-in {
      from { opacity: 0; filter: blur(8px); letter-spacing: .5em; }
      to   { opacity: 1; filter: blur(0);   letter-spacing: .05em; }
    }
  </style>

  <script>
    const menu = document.getElementById('custom-context-menu');
    const screamerOverlay = document.getElementById('screamer-overlay');
    const screamerVideo = document.getElementById('screamer-video');
    let hideTimer = null;
    let clickCount = 0;

    const angryMessages = [
      "source in my github ^_~",
      "i already told you, it's in my github",
      "the source is in my github. stop clicking",
      "it's in my GITHUB, go look there...",
      "i said it's in my github, why do you keep clicking?",
      "there's nothing else here, it's all in my github",
      "github.com/zyresrcs. go. now.",
      "do you not read?? IT'S IN MY GITHUB",
      "i'm not telling you again, it's in my github...",
      "last time: MY. GITHUB.",
      "you keep right clicking and it's STILL in my github",
      "i'm getting really mad, source = github!!",
      "GO TO MY GITHUB OR ELSE",
      "im gonna scream u in the next right click"
    ];

    function getRedColor(step, total) {
      const r = 91 + Math.round((255 - 91) * (step / total));
      const g = 65 - Math.round(65 * (step / total));
      const b = 139 - Math.round(139 * (step / total));
      return `rgb(${r}, ${g}, ${b})`;
    }

    const MENU_MS = 1500;
    const SCREAM_MS = 1500;
    const SORRY_MS = 3000;
    const TRIGGER_AT = 15;
    let screaming = false;
    let screamTimer = null;
    let calmTimer = null;

    screamerVideo.load();

    function restartPop() {
      menu.classList.remove('pop');
      void menu.offsetWidth;
      menu.classList.add('pop');
    }

    function showMenu(text, color, x, y, shake = 0, duration = MENU_MS) {
      clearTimeout(hideTimer);
      menu.classList.remove('sorry');
      menu.textContent = text;
      menu.style.color = color;
      menu.style.setProperty('--shake', `${shake}px`);
      menu.style.left = `${x}px`;
      menu.style.top = `${y}px`;
      menu.classList.add('show');
      restartPop();
      hideTimer = setTimeout(() => menu.classList.remove('show'), duration);
    }

    function enterFullscreen() {
      const el = screamerOverlay;
      const req = el.requestFullscreen || el.webkitRequestFullscreen || el.msRequestFullscreen;
      if (req) { try { const p = req.call(el); if (p && p.catch) p.catch(() => {}); } catch {} }
    }

    function exitFullscreen() {
      const fs = document.fullscreenElement || document.webkitFullscreenElement;
      if (!fs) return;
      const ex = document.exitFullscreen || document.webkitExitFullscreen || document.msExitFullscreen;
      if (ex) { try { const p = ex.call(document); if (p && p.catch) p.catch(() => {}); } catch {} }
    }

    function startScreamer() {
      screaming = true;
      clickCount = 0;
      menu.classList.remove('show');
      document.body.style.setProperty('--rage', 0);

      try { if (typeof audio !== 'undefined' && !audio.paused) audio.dataset.wasPlaying = '1'; audio.volume = 0; } catch {}

      screamerOverlay.classList.add('show');
      enterFullscreen();

      screamerVideo.pause();
      screamerVideo.currentTime = 0;
      screamerVideo.muted = false;
      screamerVideo.volume = 1;
      const p = screamerVideo.play();
      if (p && p.catch) p.catch(() => {});

      clearTimeout(screamTimer);
      screamTimer = setTimeout(endScreamer, SCREAM_MS);
    }

    function endScreamer() {
      if (!screaming) return;
      screaming = false;
      screamerVideo.pause();
      screamerOverlay.classList.remove('show');

      setTimeout(() => {
        exitFullscreen();
        try { if (typeof applyVolume === 'function') applyVolume(); } catch {}
        showMenu('sorry', '#5b418b', window.innerWidth / 2, window.innerHeight / 2, 0, SORRY_MS);
        menu.classList.add('sorry');
      }, 1400);
    }

    screamerVideo.addEventListener('ended', endScreamer);

    document.addEventListener('contextmenu', (e) => {
      e.preventDefault();
      if (screaming) return;

      clickCount++;

      if (clickCount >= TRIGGER_AT) {
        startScreamer();
        return;
      }

      clearTimeout(calmTimer);
      calmTimer = setTimeout(() => {
        clickCount = 0;
        document.body.style.setProperty('--rage', 0);
      }, 6000);

      const index = Math.min(clickCount - 1, angryMessages.length - 1);
      const last = angryMessages.length - 1;
      document.body.style.setProperty('--rage', (index / last) * 0.9);
      showMenu(
        angryMessages[index],
        getRedColor(index, last),
        e.clientX + 10,
        e.clientY - 30,
        Math.round((index / last) * 6)
      );
    });

    document.addEventListener('fullscreenchange', () => {
      if (!document.fullscreenElement && screaming) endScreamer();
    });

    document.addEventListener('click', () => {
      if (screaming) return;
      clearTimeout(hideTimer);
      menu.classList.remove('show');
    });

    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape' && !screaming) {
        clearTimeout(hideTimer);
        menu.classList.remove('show');
      }
    });
  </script>
